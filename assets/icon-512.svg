<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="معرض الأعمال">
  <!-- خلفية كاملة (full-bleed) — آمنة لقناع maskable -->
  <rect width="512" height="512" fill="#f59e0b"/>
  <!-- الحرف داخل المنطقة الآمنة (80% المركزية) -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, Tahoma, Arial, sans-serif" font-weight="700"
        font-size="276" fill="#ffffff">ن</text>
  <!-- نقطة teal مميّزة -->
  <circle cx="374" cy="160" r="30" fill="#0d0e12"/>
  <circle cx="374" cy="160" r="16" fill="#47deb3"/>
</svg>
