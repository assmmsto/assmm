<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="معرض الأعمال">
  <!-- خلفية كاملة (full-bleed) — آمنة لقناع maskable -->
  <rect width="192" height="192" fill="#f59e0b"/>
  <!-- الحرف داخل المنطقة الآمنة (80% المركزية) -->
  <text x="96" y="96" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, Tahoma, Arial, sans-serif" font-weight="700"
        font-size="104" fill="#ffffff">ن</text>
  <!-- نقطة teal مميّزة -->
  <circle cx="140" cy="60" r="11" fill="#0d0e12"/>
  <circle cx="140" cy="60" r="6" fill="#47deb3"/>
</svg>
